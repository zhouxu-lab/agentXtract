name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lock.txt
      # The parser imports Docling lazily. Unit tests exercise its adapter with
      # fixtures, so CI uses the locked test environment rather than downloading
      # Docling's multi-gigabyte GPU-capable Torch stack. Production and local
      # end-to-end parsing continue to use requirements-lock.txt.
      - run: python -m pip install -r requirements-ci-lock.txt
      - run: python -m pytest tests -q
